# ============================================================================
# peptivaLab — full self-host stack
# Run: docker compose up -d
# ============================================================================

name: peptivalab

# Reusable log rotation: 10 MiB per file, 3 files = ~30 MiB max per service.
# Without this, Docker's JSON log driver fills the disk over months.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  pvl: {}

volumes:
  pg_data: {}
  storage_data: {}
  caddy_data: {}
  caddy_config: {}
  ircd_data: {}
  backups: {}

services:
  # --------------------------------------------------------------------------
  # Postgres (Supabase-tuned image)
  # --------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.6.1.115
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Mount our app schema as a SINGLE FILE (not the whole dir) so we don't
      # shadow the supabase/postgres image's own bootstrap scripts that create
      # supabase_admin / supabase_auth_admin / supabase_storage_admin / authenticator.
      - ./initdb/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./initdb/zz-app-schema.sql:/docker-entrypoint-initdb.d/zz-app-schema.sql:ro
    networks: [pvl]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------------------
  # Supabase Auth (GoTrue)
  # --------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    logging: *default-logging
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_SUPABASE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${SITE_DOMAIN}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    networks: [pvl]

  # --------------------------------------------------------------------------
  # PostgREST (REST API over Postgres)
  # --------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    logging: *default-logging
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks: [pvl]

  # --------------------------------------------------------------------------
  # Realtime (Postgres replication → WS)
  # --------------------------------------------------------------------------
  realtime:
    image: supabase/realtime:v2.30.34
    restart: unless-stopped
    logging: *default-logging
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${JWT_SECRET}${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      FLY_ALLOC_ID: local
      FLY_APP_NAME: realtime
    networks: [pvl]

  # --------------------------------------------------------------------------
  # Storage
  # --------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    logging: *default-logging
    depends_on: { db: { condition: service_healthy } }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - storage_data:/var/lib/storage
    networks: [pvl]

  # --------------------------------------------------------------------------
  # Kong API gateway (single Supabase entry point on :8000)
  # --------------------------------------------------------------------------
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    logging: *default-logging
    depends_on: [auth, rest, realtime, storage]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    networks: [pvl]

  # --------------------------------------------------------------------------
  # Supabase Studio (admin UI)
  # --------------------------------------------------------------------------
  studio:
    image: supabase/studio:20241014-c083b3b
    restart: unless-stopped
    logging: *default-logging
    depends_on: [kong]
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: peptivaLab
      DEFAULT_PROJECT_NAME: peptivalab
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${PUBLIC_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    networks: [pvl]

  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    logging: *default-logging
    depends_on: { db: { condition: service_healthy } }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [pvl]

  # --------------------------------------------------------------------------
  # The TanStack Start app itself (built from the repo root)
  # --------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: self-host/Dockerfile
      args:
        VITE_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_PLAUSIBLE_SRC: ${VITE_PLAUSIBLE_SRC:-https://plausible.io/js/script.js}
        # Frontend points at its own origin by default; checkout calls
        # ${VITE_PAYMENTS_API_BASE_URL}/api/crypto/create-invoice.
        VITE_PAYMENTS_API_BASE_URL: ${VITE_PAYMENTS_API_BASE_URL:-https://${SITE_DOMAIN}}
    restart: unless-stopped
    logging: *default-logging
    depends_on: [kong, ws-gateway]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      # Server-side Supabase (use internal Kong, faster + no TLS overhead)
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Admin
      ADMIN_CHAT_PASSWORD: ${ADMIN_CHAT_PASSWORD}
      # IRC bridge
      IRC_GATEWAY_URL: ws://ws-gateway:8080
      IRC_SERVER: ${CHAT_DOMAIN}
      IRC_BOT_NICK: ${IRC_BOT_NICK}
      IRC_BOT_PASSWORD: ${GATEWAY_TOKEN}
      IRC_CHANNEL_PREFIX: ${IRC_CHANNEL_PREFIX}
      # Email notifications (contact form, alerts). Leave SMTP_HOST empty to
      # disable — submissions still succeed but no email is sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      # Shared bearer token used by sibling containers (e.g. backup) to POST
      # alerts to /api/internal/notify. Generate with: openssl rand -hex 32
      INTERNAL_NOTIFY_TOKEN: ${INTERNAL_NOTIFY_TOKEN:-}
      # Optional admin 2FA (TOTP). Leave ADMIN_TOTP_SECRET empty to disable.
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      ADMIN_TOTP_ISSUER: ${ADMIN_TOTP_ISSUER:-PeptivaLab}
      ADMIN_TOTP_ACCOUNT: ${ADMIN_TOTP_ACCOUNT:-admin}
      # Signed admin session cookie (REQUIRED in production).
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # Bcrypt hash of admin password (recommended). Falls back to plaintext
      # ADMIN_CHAT_PASSWORD when empty.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # Paymento crypto checkout (optional). Leave PAYMENTO_API_KEY empty to
      # disable crypto payments — the rest of the app keeps working.
      PAYMENTO_API_KEY: ${PAYMENTO_API_KEY:-}
      PAYMENTO_HMAC_SECRET: ${PAYMENTO_HMAC_SECRET:-}
      PAYMENTO_BASE_URL: ${PAYMENTO_BASE_URL:-https://api.paymento.io/v1}
      PAYMENTO_SPEED: ${PAYMENTO_SPEED:-1}
      CRYPTO_SUCCESS_URL: ${CRYPTO_SUCCESS_URL:-}
      CRYPTO_CANCEL_URL: ${CRYPTO_CANCEL_URL:-}
    networks: [pvl]

  # --------------------------------------------------------------------------
  # IRC daemon + WebSocket gateway (re-uses your existing irc-server/ folder)
  # --------------------------------------------------------------------------
  ircd:
    image: inspircd/inspircd-docker:3
    restart: unless-stopped
    logging: *default-logging
    environment:
      INSP_NET_NAME: peptivalab
      INSP_OPER_PASSWORD: ${IRC_OPER_PASSWORD}
      INSP_SERVER_PASSWORD: ${IRC_SERVER_PASSWORD}
    volumes:
      - ircd_data:/inspircd/data
      - ../irc-server/inspircd/inspircd.conf:/inspircd/conf/inspircd.conf:ro
    ports:
      - "6697:6697"   # public IRC over TLS for HexChat etc.
    networks: [pvl]

  ws-gateway:
    build: ../irc-server/ws-gateway
    restart: unless-stopped
    logging: *default-logging
    depends_on: [ircd]
    environment:
      IRC_HOST: ircd
      IRC_PORT: 6667
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      PORT: 8080
    networks: [pvl]

  # --------------------------------------------------------------------------
  # Caddy — single TLS reverse proxy for everything
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on: [app, kong, ws-gateway, studio]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN}
      CHAT_DOMAIN: ${CHAT_DOMAIN}
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [pvl]

  # --------------------------------------------------------------------------
  # Daily Postgres backup (cron inside the container)
  # Dumps to the `backups` volume; retains last $BACKUP_RETENTION_DAYS files.
  # Copy off-server with: docker run --rm -v peptivalab_backups:/b -v $PWD:/out alpine cp -r /b /out/
  # --------------------------------------------------------------------------
  backup:
    build: ./backup
    restart: unless-stopped
    logging: *default-logging
    depends_on: { db: { condition: service_healthy } }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_CRON: ${BACKUP_CRON:-17 3 * * *}
      BACKUP_VERIFY_CRON: ${BACKUP_VERIFY_CRON:-43 4 * * 0}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Current encryption key — used to encrypt new dumps. Empty = plaintext.
      BACKUP_ENCRYPTION_KEY_ID: ${BACKUP_ENCRYPTION_KEY_ID:-}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      # Old keys kept around so historical dumps can still be decrypted.
      # Format: id1:pass1,id2:pass2  (passphrases must not contain ',' or ':')
      BACKUP_OLD_KEYS: ${BACKUP_OLD_KEYS:-}
      # Off-site upload (rclone). Set both to enable.
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-}
      # Email alerts on backup / verify failures (optional but recommended)
      # Backup alerts now go through the app (uses editable templates from
      # /admin/innehall). Set INTERNAL_NOTIFY_TOKEN in .env to enable.
      APP_INTERNAL_URL: http://app:3000
      INTERNAL_NOTIFY_TOKEN: ${INTERNAL_NOTIFY_TOKEN:-}
      TZ: UTC
    volumes:
      - backups:/backups
    networks: [pvl]
