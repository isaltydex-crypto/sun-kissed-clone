# Minimal InspIRCd config for the peptivaLab support bridge.
# Runtime values (oper password, server password) are injected from
# environment variables by the official inspircd-docker image.

<server name="chat.peptivalab.local"
        description="peptivaLab support IRC"
        network="peptivalab">

<admin name="peptivaLab admin"
       nick="admin"
       email="hej@peptivalabgroup.com">

# Plain port for the in-cluster ws-gateway only.
<bind address="0.0.0.0" port="6667" type="clients">

# TLS port for human IRC clients (HexChat / mIRC / weechat).
# The ssl="gnutls" attribute references the <gnutls> provider block defined
# in tls.conf, which is auto-generated by the inspircd-docker entrypoint
# (self-signed cert at /inspircd/conf/tls/{cert,key}.pem). Without the
# include below, port 6697 accepts the connection but never performs a TLS
# handshake — clients see "wrong version number".
<bind address="0.0.0.0" port="6697" type="clients" ssl="gnutls">

# Loads ssl_gnutls module + <gnutls certfile=… keyfile=…> provider block.
<include file="tls.conf">

<connect name="default"
         allow="*"
         password=""
         timeout="60"
         pingfreq="120"
         hardsendq="1M"
         softsendq="8K"
         recvq="8K"
         localmax="100"
         globalmax="1000"
         maxchans="64"
         port="6667 6697">

<oper name="admin"
      hash="plaintext"
      password=""
      host="*@*"
      type="NetAdmin">

<class name="NetAdmin"
       commands="*"
       privs="*"
       chanmodes="*"
       usermodes="*">

<type name="NetAdmin"
      classes="NetAdmin">

<options prefixquit="Quit: "
         syntaxhints="yes"
         cyclehosts="yes"
         ircumsgprefix="no"
         announcets="yes"
         allowmismatch="no"
         defaultmodes="not"
         exemptchanops="nonick:v">

<channels users="64" opers="0">
<chanlimits prefix="#" limit="64">

<security hidewhois=""
          hidebans="no"
          hidekills=""
          hideulines="no"
          flatlinks="no"
          userstats="Pu"
          customversion=""
          maxtargets="20"
          allowcoreunload="no"
          announceinvites="dynamic">

<performance netbuffersize="10240"
             somaxconn="128"
             softlimit="1024"
             quietbursts="yes"
             nouserdns="yes">

# motd/rules files intentionally omitted — image ships without them.

<module name="cap">
<module name="ircv3">
<module name="ircv3_servertime">
<module name="namesx">
<module name="uhnames">
<module name="services_account">

# So channels disappear when empty (good for per-visitor #pvl-* channels).
<channels users="64" opers="0">
