# Minimal InspIRCd config for the peptivaLab support bridge.
# Runtime values (oper password, server password) are injected from
# environment variables by the official inspircd-docker image.

<server name="chat.peptivalab.local"
        description="peptivaLab support IRC"
        network="peptivalab">

<admin name="peptivaLab admin"
       nick="admin"
       email="hej@peptivalabgroup.com">

# Plain port for the in-cluster ws-gateway only.
<bind address="0.0.0.0" port="6667" type="clients">

# TLS port for human IRC clients (HexChat / mIRC / weechat).
<bind address="0.0.0.0" port="6697" type="clients" ssl="gnutls">

<connect name="default"
         allow="*"
         password=""
         timeout="60"
         pingfreq="120"
         hardsendq="1M"
         softsendq="8K"
         recvq="8K"
         localmax="100"
         globalmax="1000"
         maxchans="64"
         port="6667 6697">

<oper name="admin"
      hash="plaintext"
      password=""
      host="*@*"
      type="NetAdmin">

<class name="NetAdmin"
       commands="*"
       privs="*"
       chanmodes="*"
       usermodes="*">

<type name="NetAdmin"
      classes="NetAdmin">

<options prefixquit="Quit: "
         suffixquit=""
         prefixpart="&quot;"
         suffixpart="&quot;"
         syntaxhints="yes"
         cyclehosts="yes"
         ircumsgprefix="no"
         announcets="yes"
         allowmismatch="no"
         defaultmodes="not"
         exemptchanops="nonick:v">

<channels users="64" opers="0">
<chanlimits prefix="#" limit="64">

<security hidewhois=""
          hidebans="no"
          hidekills=""
          hideulines="no"
          flatlinks="no"
          userstats="Pu"
          customversion=""
          maxtargets="20"
          allowcoreunload="no"
          announceinvites="dynamic">

<performance netbuffersize="10240"
             somaxconn="128"
             softlimit="1024"
             quietbursts="yes"
             nouserdns="yes">

<files motd="/inspircd/conf/motd.txt"
       rules="/inspircd/conf/rules.txt">

<module name="cap">
<module name="ircv3">
<module name="ircv3_servertime">
<module name="namesx">
<module name="uhnames">
<module name="services_account">

# So channels disappear when empty (good for per-visitor #pvl-* channels).
<channels users="64" opers="0">
