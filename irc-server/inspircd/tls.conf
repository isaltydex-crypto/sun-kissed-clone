# TLS module + cert config for InspIRCd. Cert files are populated by
# entrypoint-tls.sh from the shared Caddy data volume at container start.
<module name="m_ssl_gnutls.so">

<gnutls certfile="/inspircd/conf/tls/cert.pem"
        keyfile="/inspircd/conf/tls/key.pem"
        hash="sha256">

# Bind that requires TLS — for external IRC clients (HexChat, RevolutionIRC, mIRC).
<bind address="0.0.0.0" port="6697" type="clients" ssl="gnutls">
